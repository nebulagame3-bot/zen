<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#070418">
<title>Nebula Swim Zen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, dreamy, playful: a late-night aquarium drifting through space
   IDEA: an aquarium glass you swim through; every move stirs coloured ink
   PICTURE: the full-bleed game canvas: swirling ink, planets, glowing fish
   COLOUR and TYPE: indigo night #070418, aqua #5ef2e0, coral #ff7a8a; Fredoka, rounded like bubbles
   LAYOUT: game fills the screen; glass panels float on top, safe-area aware */
:root{color-scheme:dark;--bg:#070418;--ink:#f3efff;--muted:#b9b0e4;--glass:rgba(20,12,52,.7);--line:rgba(255,255,255,.14);--coral:#ff7a8a;--aqua:#5ef2e0}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 Fredoka,ui-rounded,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
#c,#fl{position:fixed;inset:0;width:100%;height:100%;display:block}#fl{pointer-events:none}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 12px) 16px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}
.pill{background:rgba(10,6,30,.45);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;font-size:18px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);white-space:nowrap}
#x2{color:#ffd6f0;border-color:rgba(255,122,138,.6);font-size:15px}
#pause{pointer-events:auto;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(10,6,30,.45);color:var(--ink);font:600 16px Fredoka,sans-serif;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#combo{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 150px);transform:translateX(-50%);font-size:22px;font-weight:600;text-shadow:0 0 14px var(--coral);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 74px);text-align:center;font-size:clamp(24px,6.5vw,34px);font-weight:600;line-height:1.05;opacity:0;transition:opacity .8s;text-shadow:0 0 20px rgba(94,242,224,.6);pointer-events:none;padding:10px 16px;background:linear-gradient(90deg,transparent,rgba(10,6,30,.6) 18%,rgba(10,6,30,.6) 82%,transparent)}
#err{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);background:rgba(10,6,30,.8);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--muted);pointer-events:none;z-index:5}
#toast small{display:block;font-size:15px;font-weight:500;color:var(--muted);text-shadow:none;margin-bottom:6px}
#menu{position:fixed;inset:0;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;background:linear-gradient(rgba(7,4,24,.25),rgba(7,4,24,.82) 40%);padding:calc(env(safe-area-inset-top) + 22px) 16px calc(env(safe-area-inset-bottom) + 110px)}
.wrap{max-width:540px;margin:0 auto}
h1{font-size:clamp(38px,11vw,52px);line-height:1.05;margin:0;font-weight:600;text-wrap:balance}
h1 span{color:var(--aqua)}
.sub{color:var(--muted);margin:6px 0 0;font-size:16px}
h2{font-size:17px;font-weight:600;margin:22px 0 10px}
.card{display:flex;gap:14px;align-items:center;background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:12px 14px;margin-top:18px}
.card canvas{width:96px;height:96px;flex:none}
.card b{font-size:21px;font-weight:600;display:block;line-height:1.2}
.card p{margin:4px 0 0;color:var(--muted);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.fb{appearance:none;border:1px solid var(--line);background:rgba(20,12,52,.55);border-radius:16px;color:var(--ink);padding:6px 4px 8px;font:500 13px/1.15 Fredoka,sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:44px;cursor:pointer}
.fb canvas{width:56px;height:56px}
.fb[aria-pressed=true]{border-color:var(--aqua);box-shadow:inset 0 0 0 2px var(--aqua);background:rgba(94,242,224,.12)}
.mix{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:6px 16px}
.mix label{display:grid;grid-template-columns:6.5em minmax(0,1fr);align-items:center;gap:12px;min-height:48px;font-size:16px}
input[type=range]{width:100%;accent-color:var(--aqua);height:32px;margin:0}
.note{color:var(--muted);font-size:14px;margin:12px 4px 0}
#go{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 18px);width:min(340px,88vw);height:58px;border:0;border-radius:999px;font:600 22px Fredoka,sans-serif;color:#13072a;background:linear-gradient(90deg,var(--aqua),#d8f9ff 50%,var(--coral));box-shadow:0 10px 34px rgba(94,242,224,.3);cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:3px}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){#toast,#combo{transition:none}}
</style>
</head>
<body>
<canvas id="fl" aria-hidden="true"></canvas>
<canvas id="c" aria-label="Game: slide left and right to steer your fish"></canvas>

<div class="hud hidden" id="hud">
  <div class="pill" id="score">★ 0</div>
  <div class="pill hidden" id="x2">×2</div>
  <button id="pause" aria-label="Pause">II</button>
</div>
<div id="combo"></div>
<div id="toast"></div>
<div id="err" hidden></div>

<div id="menu">
  <div class="wrap">
    <h1>Nebula Swim <span>Zen</span></h1>
    <p class="sub">Swim forever. Crashes only slow you down.</p>

    <div class="card">
      <canvas id="pv" width="192" height="192"></canvas>
      <div><b id="pvName"></b><p id="pvFact"></p></div>
    </div>

    <h2>Every fish, unlocked</h2>
    <div class="grid" id="grid"></div>

    <h2>Sound mix</h2>
    <div class="mix">
      <label>Music <input type="range" id="vMusic" min="0" max="1" step=".01"></label>
      <label>Water <input type="range" id="vWater" min="0" max="1" step=".01"></label>
      <label>Effects <input type="range" id="vSfx" min="0" max="1" step=".01"></label>
      <label>Steering <input type="range" id="vSens" min=".6" max="2.2" step=".05"></label>
    </div>
    <p class="note">Slide anywhere to steer. Laser beams are silent. No sound on iPhone? Turn off Silent Mode.</p>
  </div>
</div>
<button id="go">Swim</button>

<script>
{
const $=id=>document.getElementById(id);
const cv=$('c'), g=cv.getContext('2d');
let W=0,H=0,DPR=1,fishR=20,fishY=0;
const rand=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>v<a?a:v>b?b:v, TAU=Math.PI*2;
const hx=h=>{const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]};
const rgba=(h,a)=>{const[r,gg,b]=hx(h);return`rgba(${r},${gg},${b},${a})`};
function hsl(h,s,l){h=((h%360)+360)%360;const a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))};return[f(0),f(8),f(4)]}

/* ---------- saved settings ---------- */
let store={};try{store=JSON.parse(localStorage.getItem('nebswim')||'{}')}catch(e){}
store.mix=store.mix||{music:.65,water:.7,sfx:.85};store.sens=store.sens||1.25;store.fish=store.fish|0;
const save=()=>{try{localStorage.setItem('nebswim',JSON.stringify(store))}catch(e){}};

/* ---------- the fish (originals, based on real sea creatures) ---------- */
const FISH=[
 {n:'Sky Veil',a:'art',img:'fish-sky.webp',hx:.51,c:['#5ab8ff','#bfe6ff','#2a5ad8'],tr:[200,240],f:'Bettas breathe air from the surface with a special organ called the labyrinth.'},
 {n:'Blossom Veil',a:'art',img:'fish-blossom.webp',hx:.452,c:['#ff6ad8','#ffc8f0','#b02ab0'],tr:[300,330],f:'Long flowing fins were bred by people; wild bettas have short fins.'},
 {n:'Ember Veil',a:'art',img:'fish-ember.webp',hx:.447,c:['#ff8a2a','#ffe08a','#e0461a'],tr:[18,45],f:'Veiltail fish trail long tails that droop like a silk veil.'},
 {n:'Lagoon Veil',a:'art',img:'fish-lagoon.webp',hx:.476,c:['#4ae0b0','#d8ff9a','#1aa08a'],tr:[110,165],f:'A betta flares its fins wide to look bigger.'},
 {n:'Violet Veil',a:'art',img:'fish-violet.webp',hx:.461,c:['#a05aff','#f0b0ff','#6a1ad8'],tr:[265,295],f:'Male bettas build floating nests made of bubbles.'},
 {n:'Opal Veil',a:'art',img:'fish-opal.webp',hx:.454,c:['#c8d8ff','#ffe0f8','#8aa0ff'],tr:[200,330],f:'Some fish shimmer because their scales hold tiny reflective crystals.'},
 {n:'Moon Jelly',a:'jelly',v:'moon',c:['#ffc6f0','#ff8ae0','#ffffff'],tr:[310,280],tn:16,arms:4,f:'Moon jellies have no brain, just a net of nerves.'},
 {n:'Sea Nettle',a:'jelly',v:'nettle',c:['#ffae4a','#ff6a2a','#ffe0b0'],tr:[25,10],tn:12,tlen:4.4,arms:4,alen:2.6,f:'Sea nettles trail long stinging tentacles to catch plankton.'},
 {n:'Lion’s Mane',a:'jelly',v:'mane',c:['#ff6a3a','#ffb84a','#ffe8c0'],tr:[18,42],tn:22,tlen:4.8,arms:6,alen:2.2,f:'The lion’s mane is one of the largest jellies, with tentacles that can stretch over 30 meters.'},
 {n:'Crystal Jelly',a:'jelly',v:'crystal',c:['#c8fff0','#5affb0','#ffffff'],tr:[150,190],tn:20,tlen:3,arms:2,alen:1,f:'Crystal jellies glow green thanks to a protein scientists now use in labs.'},
 {n:'Flower Hat Jelly',a:'jelly',v:'flower',c:['#ffd6f0','#ff5a9a','#ffe47a'],tr:[330,410],tn:14,tlen:2.6,arms:3,f:'Flower hat jellies carry glowing, colorful tentacles on top of their bell.'},
 {n:'Comb Jelly',a:'jelly',v:'comb',c:['#d8f4ff','#a0e0ff','#ffffff'],tr:[180,300],tn:2,tlen:5,arms:0,f:'A comb jelly’s rainbow is light scattering off its beating combs.'},
];
for(const F of FISH)if(F.img){F.im=new Image();F.im.decoding='async';F.im.src=F.img}
function dot(c,x,y,r){c.beginPath();c.arc(x,y,r,0,TAU);c.fill()}
function rad(c,x,y,r,a,b){const gr=c.createRadialGradient(x-r*.3,y-r*.35,r*.05,x,y,r);gr.addColorStop(0,a);gr.addColorStop(1,b);return gr}
const cs=(h,s2,l,a)=>{const v=hsl(h,s2,l);return`rgba(${v[0]*255|0},${v[1]*255|0},${v[2]*255|0},${a})`};
function smooth(c,Q,move){if(move)c.moveTo(Q[0][0],Q[0][1]);else c.lineTo(Q[0][0],Q[0][1]);for(let k=1;k<Q.length-1;k++)c.quadraticCurveTo(Q[k][0],Q[k][1],(Q[k][0]+Q[k+1][0])/2,(Q[k][1]+Q[k+1][1])/2);c.lineTo(Q[Q.length-1][0],Q[Q.length-1][1])}
/* soft-body physics: each fin, tail and tentacle is a chain that lags, sways and flows */
function Rope(n,seg){return{n,seg,p:new Float32Array(n*2),o:new Float32Array(n*2),init:false}}
const rp=(R,m)=>{const a=[],n=m||R.n;for(let i=0;i<n;i++)a.push([R.p[i*2],R.p[i*2+1]]);return a};
function ropeStep(R,ax,ay,dt,st,wa,wf,wk,ph,dx0,dy0){const p=R.p,n=R.n,sg=R.seg;
 if(!R.init){for(let i=0;i<n;i++){p[i*2]=ax+dx0*sg*i;p[i*2+1]=ay+dy0*sg*i}R.init=true}
 p[0]=ax;p[1]=ay;const k=1-Math.exp(-dt*st);
 for(let i=1;i<n;i++){const j=i*2,f=i/(n-1);let dx=p[j]-p[j-2],dy=p[j+1]-p[j-1];const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;
  const a=Math.sin(time*wf-f*wk+ph)*wa*f,ca=Math.cos(a),sa=Math.sin(a),rx=dx0*ca-dy0*sa,ry=dx0*sa+dy0*ca,kk=k*(1-f*.55);
  dx+=(rx-dx)*kk;dy+=(ry-dy)*kk;const d2=Math.hypot(dx,dy)||1;p[j]=p[j-2]+dx/d2*sg;p[j+1]=p[j-1]+dy/d2*sg}}
const BV={half:{sp:1.25,tl:2.5,k:9,fl:1.05,gw:1},veil:{sp:.62,tl:3.1,k:7,fl:1.3,gw:1},crown:{sp:1.05,tl:2.5,k:9,fl:1.1,gw:1,crown:1},gold:{sp:.85,tl:2.3,k:7,fl:.8,gw:1.35},guppy:{sp:.55,tl:2,k:7,fl:.45,gw:.8}};
function makeCreature(F,s){const C={F,s,t:rand(0,10),seed:rand(0,TAU),eyes:false,ex:0,ey:0,h:[]};
 if(F.a==='art'){}
 else if(F.a==='betta'){const V=BV[F.v];C.spine=Rope(6,s*.42);C.tail=[];for(let i=0;i<V.k;i++)C.tail.push(Rope(11,s*V.tl/10));C.fins=[];for(let i=0;i<6;i++)C.fins.push(Rope(7,s*V.fl/6));C.dots=[];for(let i=0;i<16;i++)C.dots.push([rand(.05,.9),rand(-.75,.75),rand(.4,1)])}
 else{C.tent=[];const M=F.tn||12;for(let i=0;i<M;i++)C.tent.push(Rope(14,s*(F.tlen||3.4)/13*rand(.75,1.1)));C.arms=[];const A=F.arms==null?4:F.arms;for(let i=0;i<A;i++)C.arms.push(Rope(10,s*(F.alen||1.8)/9))}
 return C}
function drawArt(c,C,x,y,rot,dt){const F=C.F,s=C.s,im=F.im;C.t+=dt;C.h.push(x);if(C.h.length>36)C.h.shift();if(!im||!im.complete||!im.naturalWidth)return;
 const iw=im.naturalWidth,ih=im.naturalHeight,Hd=s*5.4,Wd=Hd*iw/ih,top=y-s*1.05,left=x-Wd*F.hx,N=46,A0=c.globalAlpha,lagAt=v=>{const n=C.h.length;if(n<2)return 0;const fi=Math.min(n-1,v*30),i0=Math.floor(fi),fr=fi-i0,a=C.h[n-1-i0],b=C.h[Math.max(0,n-2-i0)];return clamp((a+(b-a)*fr-x)*.5,-Wd*.4,Wd*.4)*Math.pow(v,1.15)};
 c.globalCompositeOperation='lighter';const gz=s*3.2;c.globalAlpha=A0*.32;c.drawImage(glow(F.c[0]),x-gz,y-gz+s*.7,gz*2,gz*2);c.globalAlpha=A0;c.globalCompositeOperation='source-over';
 const T=c.getTransform(),sc=Math.abs(T.d)||1,rowH=Math.max(1,Math.round(Hd*sc/N))/sc,y0=(Math.round(top*sc+T.f)-T.f)/sc;
 for(let i=0;i<N;i++){const v=i/N,wv=Math.pow(v,1.25),wave=Math.sin(time*3.4-v*6.5+C.seed)*Wd*.075*wv+Math.sin(time*1.6-v*2.5+C.seed)*Wd*.04*v,
  fl=1+.06*Math.sin(time*5+C.seed)*Math.exp(-(((v-.2)/.08)**2)),w=Wd*fl,lean=rot*Hd*.9*v;
  c.drawImage(im,0,v*ih,iw,ih/N,left-(w-Wd)*F.hx+wave+lagAt(v)-lean,y0+i*rowH,w,rowH)}C.ex=x+lagAt(.42);C.ey=top+.42*Hd}
function drawCreature(c,C,x,y,rot,dt){c.save();if(C.F.a==='art')drawArt(c,C,x,y,rot,dt);else if(C.F.a==='betta')drawBetta(c,C,x,y,rot,dt);else drawJelly(c,C,x,y,rot,dt);c.restore()}
function drawBetta(c,C,x,y,rot,dt){const F=C.F,s=C.s,V=BV[F.v],Dx=-Math.sin(rot),Dy=Math.cos(rot),fc=F.c,A0=c.globalAlpha;C.t+=dt;
 ropeStep(C.spine,x-Dx*s*.6,y-Dy*s*.6,dt,10,.2,7,2.6,C.seed,Dx,Dy);
 const S=C.spine.p,n=C.spine.n,L=[],Rr=[],Wd=[];
 for(let i=0;i<n;i++){const f=i/(n-1),a=Math.max(0,i-1),b=Math.min(n-1,i+1),dx=S[b*2]-S[a*2],dy=S[b*2+1]-S[a*2+1],d=Math.hypot(dx,dy)||1,nx=dy/d,ny=-dx/d,w=s*.46*V.gw*(f<.22?.62+.38*Math.sin(f/.22*Math.PI/2):1-(f-.22)/.78*.74);Wd.push([nx,ny,w]);L.push([S[i*2]+nx*w,S[i*2+1]+ny*w]);Rr.push([S[i*2]-nx*w,S[i*2+1]-ny*w])}
 const tx=S[(n-1)*2],ty=S[(n-1)*2+1];let tdx=tx-S[(n-2)*2],tdy=ty-S[(n-2)*2+1];{const d=Math.hypot(tdx,tdy)||1;tdx/=d;tdy/=d}C.ex=tx;C.ey=ty;
 const K=C.tail.length;for(let i=0;i<K;i++){const a=(i/(K-1)*2-1)*V.sp,ca=Math.cos(a),sa=Math.sin(a);ropeStep(C.tail[i],tx,ty,dt,5,.42,4,4.2,i*.42+C.seed,tdx*ca-tdy*sa,tdx*sa+tdy*ca)}
 const fx=S[4],fy=S[5],fn=Wd[2];for(let j=0;j<6;j++){const sd=j<3?1:-1,a=-sd*(.45+(j%3)*.38),ca=Math.cos(a),sa=Math.sin(a);ropeStep(C.fins[j],fx+fn[0]*fn[2]*.85*sd,fy+fn[1]*fn[2]*.85*sd,dt,5,.5,3.6,3.6,j*.8+C.seed,tdx*ca-tdy*sa,tdx*sa+tdy*ca)}
 c.globalCompositeOperation='lighter';const gz=s*3.6;c.globalAlpha=A0*.32;c.drawImage(glow(fc[1]),x-gz,y-gz+s*.5,gz*2,gz*2);c.globalAlpha=A0;
 const mem=(Ra,Rb,ox,oy,len,h0,h1,al,m)=>{const Pa=rp(Ra,m),Pb=rp(Rb,m).reverse();c.beginPath();smooth(c,Pa,1);smooth(c,Pb,0);c.closePath();const g2=c.createRadialGradient(ox,oy,0,ox,oy,len);g2.addColorStop(0,cs(h0,.95,.6,al));g2.addColorStop(.5,cs((h0+h1)/2,.95,.66,al*.55));g2.addColorStop(1,cs(h1,.95,.74,0));c.fillStyle=g2;c.fill()};
 const f0=F.fin[0],f1=F.fin[1];
 mem(C.fins[0],C.fins[2],fx,fy,s*V.fl*1.15,f0,f1,.52);mem(C.fins[3],C.fins[5],fx,fy,s*V.fl*1.15,f0,f1,.52);
 for(let i=0;i<K-1;i++){const h0=f0+(f1-f0)*i/(K-1),h1=f0+(f1-f0)*(i+1)/(K-1);mem(C.tail[i],C.tail[i+1],tx,ty,s*V.tl*1.08,h0,h1+12,.66,V.crown?8:0)}
 c.lineWidth=s*.022;c.strokeStyle=V.crown?'rgba(255,240,220,.3)':'rgba(255,255,255,.08)';for(const R of C.tail){c.beginPath();smooth(c,rp(R),1);c.stroke()}
 c.globalCompositeOperation='source-over';
 let hx=S[2]-S[0],hy=S[3]-S[1];{const d=Math.hypot(hx,hy)||1;hx/=d;hy/=d}const w0=Wd[0][2],tip=[S[0]-hx*w0*1.45,S[1]-hy*w0*1.45];
 const body=()=>{c.beginPath();smooth(c,L,1);smooth(c,Rr.slice().reverse(),0);c.quadraticCurveTo(Rr[0][0]-hx*w0*1.25,Rr[0][1]-hy*w0*1.25,tip[0],tip[1]);c.quadraticCurveTo(L[0][0]-hx*w0*1.25,L[0][1]-hy*w0*1.25,L[0][0],L[0][1]);c.closePath()};
 body();const bg=c.createLinearGradient(tip[0],tip[1],tx,ty);bg.addColorStop(0,fc[1]);bg.addColorStop(.32,fc[0]);bg.addColorStop(1,fc[2]);c.fillStyle=bg;c.globalAlpha=A0*.96;c.fill();c.globalAlpha=A0;

function drawPreview(){pc.setTransform(1,0,0,1,0,0);pc.clearRect(0,0,192,192);pc.globalCompositeOperation='lighter';pc.drawImage(glow(FISH[store.fish].c[0]),16,16,160,160);pc.globalCompositeOperation='source-over';if(!pvC||pvC.F!==FISH[store.fish]){pvC=makeCreature(FISH[store.fish],25);pvC.eyes=true}drawCreature(pc,pvC,96+Math.sin(time*.9)*12,FISH[store.fish].a==='art'?34:50,Math.sin(time*.9+1)*.06,frameDt)}
function selectFish(i){store.fish=i;save();me=makeCreature(FISH[i],fishR);me.eyes=true;pvC=null;$('pvName').textContent=FISH[i].n;$('pvFact').textContent=FISH[i].f;document.querySelectorAll('.fb').forEach((b,j)=>b.setAttribute('aria-pressed',j===i))}
$('grid').innerHTML=FISH.map((f,i)=>`<button class="fb" data-i="${i}" aria-pressed="false"><canvas width="112" height="112"></canvas>${f.n}</button>`).join('');
function drawThumb(c,i){const F=FISH[i],C=makeCreature(F,19);C.eyes=true;for(let k=0;k<(F.a==='art'?1:45);k++){c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,112,112);drawCreature(c,C,56,F.a==='art'?26:30,0,1/30)}}
FISH.forEach((F,i)=>{if(F.im&&!F.im.complete)F.im.addEventListener('load',()=>{const k=document.querySelector(`.fb[data-i="${i}"] canvas`);if(k)drawThumb(k.getContext('2d'),i)})});
document.querySelectorAll('.fb').forEach(b=>{const i=+b.dataset.i,c=b.querySelector('canvas').getContext('2d');drawThumb(c,i);b.addEventListener('click',()=>{audioInit();selectFish(i);if(A.ctx)bloop(380,.1,.15,0,A.sfx,2.2)})});
for(const[id,key]of[['vMusic','music'],['vWater','water'],['vSfx','sfx']]){const el=$(id);el.value=store.mix[key];el.addEventListener('input',()=>{store.mix[key]=+el.value;save();if(A.ctx){const b=A[key],v=key==='music'?.55:key==='water'?.7:1;b.vol.gain.setTargetAtTime(+el.value*v,A.ctx.currentTime,.05)}})}
const sens=$('vSens');sens.value=store.sens;sens.addEventListener('input',()=>{store.sens=+sens.value;save()});
function launchFx(){const F=FISH[store.fish],c1=hsl(F.tr[0],.95,.6),c2=hsl(F.tr[1],.95,.55);for(let i=0;i<7;i++){const x=W/2+rand(-W*.1,W*.1);paint(x,H*rand(.88,1),W*rand(.06,.11),i%3?c1:[1,.25,.8],1.2);force(x,H,W*.1,rand(-1,1)*W*.4,-H*rand(1.2,2))}swirl(W*.32,H*.9,W*.12,W);swirl(W*.68,H*.9,W*.12,-W);launchSound();setTimeout(()=>toast(ZONES[zone].n,'New zone'),900)}
function startPlay(){audioInit();if(!hasRun){hasRun=true;obs=[];picks=[];runStars=0;zenT=0;speedMul=.6;spawnAcc=0;nextGap=H*.35;zone=0;zoneCount=0;zoneDist=0;fish.tx=fish.x=W/2;launch=1;launchFx()}else fish.inv=Math.max(fish.inv,1.2);
 mode='play';$('menu').classList.add('hidden');$('go').classList.add('hidden');$('hud').classList.remove('hidden')}
function openMenu(){mode='menu';save();$('menu').classList.remove('hidden');$('go').classList.remove('hidden');$('go').textContent=hasRun?'Resume':'Swim';$('hud').classList.add('hidden');comboEl.style.opacity=0}
$('go').addEventListener('click',startPlay);$('pause').addEventListener('click',openMenu);
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(mode==='play')openMenu();if(A.ctx)A.ctx.suspend()}else if(A.ctx&&hasRun)A.ctx.resume()});
addEventListener('resize',resize);
resize();selectFish(store.fish<FISH.length?store.fish:0);requestAnimationFrame(frame);
}
</script>
</body>
